name: link-check

# Gentle, scheduled link checking. Weekly, not on every push, so we don't hammer
# listed sites. Also runnable on demand.
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check every homepage and repo link
        run: python scripts/check_links.py --workers 6 --timeout 25
