name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install schema validator
        run: pip install jsonschema
      - name: Validate dataset (schema + integrity)
        run: python scripts/validate.py
      - name: README tables in sync with data
        run: python scripts/gen_tables.py --check
      - name: SVG assets well-formed
        run: |
          python - <<'PY'
          import glob, xml.dom.minidom as m, sys
          bad = 0
          for f in glob.glob("assets/*.svg"):
              try:
                  m.parse(f)
              except Exception as e:
                  bad += 1; print("BAD", f, e)
          print("svg files checked:", len(glob.glob("assets/*.svg")))
          sys.exit(1 if bad else 0)
          PY
      - name: Unit tests
        run: python -m unittest discover -s tests -v
